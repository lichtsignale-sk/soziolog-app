# Zugriffslog OHNE Query-String.
#
# Zwei Wege dieser Anwendung tragen ihr Geheimnis in der Adresse: der
# Passwort-Reset-Link (/passwort-zuruecksetzen?token=…) und der Einrichtungslink
# (/api/setup/start?token=…). Beide sind vollwertige Kontouebernahme-Token. Das
# Standard-Log von nginx schreibt mit $request die komplette Zeile inklusive
# Query — damit stuenden die Token dauerhaft im Log des Containers.
#
# Die Anwendung selbst maskiert sie bereits (apps/api/src/common/log-maskierung.ts);
# nginx ist der zweite Ort, an dem sie sonst landen wuerden.
#
# Die map schneidet alles ab dem Fragezeichen ab. Bewusst $request_uri statt
# $uri: $uri ist der Pfad NACH try_files, bei der SPA-Weiterleitung also immer
# /index.html — das Log waere unbrauchbar.
map $request_uri $pfad_ohne_query {
    "~^(?<pfad>[^?]*)"  $pfad;
}

# Zweite Stufe: Der EINLADUNGSLINK traegt sein Token im Pfad
# (`/einladung/<token>`, gebaut in apps/api/src/setup/setup.service.ts und
# admin-personen.controller.ts). Die Query-Maskierung oben greift dort nicht.
# Was hinter dem Token folgt, bleibt sichtbar — es sagt, was versucht wurde.
map $pfad_ohne_query $pfad_ohne_geheimnis {
    default                                        $pfad_ohne_query;
    "~^(?<vorn>/(?:api/)?einladung)/[^/]+(?<rest>/.*)?$"  "$vorn/<maskiert>$rest";
}

log_format ohne_geheimnisse '$remote_addr - $remote_user [$time_local] '
                            '"$request_method $pfad_ohne_geheimnis $server_protocol" '
                            '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log ohne_geheimnisse;

    include /etc/nginx/snippets/sicherheit.conf;

    # DER UPSTREAM WIRD ZUR LAUFZEIT AUFGELOEST.
    #
    # Steht der Name fest im proxy_pass, loest nginx ihn beim START auf — und
    # bricht ab, wenn er fehlt: `[emerg] host not found in upstream "api"`.
    # Faellt der API-Container weg, startet dann auch das Frontend nicht mehr,
    # und der Nutzer sieht keine Fehlerseite, sondern gar nichts. Ueber eine
    # Variable plus Resolver wird erst bei der Anfrage aufgeloest; ein fehlender
    # Upstream ergibt dann ein 502 auf /api/, waehrend die Oberflaeche laedt.
    #
    # 127.0.0.11 ist der eingebaute DNS von Docker.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # $request_uri statt eines festen Pfads: Sobald proxy_pass eine Variable
        # enthaelt, ersetzt nginx das location-Praefix NICHT mehr selbst. Quelle
        # und Ziel sind hier ohnehin derselbe Pfad.
        set $api_ziel http://api:3000;
        proxy_pass $api_ziel$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # HOCHGELADENE DATEIEN. Sie liegen im Dateisystem der API, nicht
    # hier. Ohne diesen Block fielen /uploads/avatare/<uuid>.webp in das
    # try_files oben und lieferten die index.html aus — der Browser bekam HTML
    # statt eines Bildes, und kein Avatar wurde je angezeigt.
    location /uploads/ {
        set $uploads_ziel http://api:3000;
        proxy_pass $uploads_ziel$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        # Ein eigenes add_header verwirft die Kopfzeilen der Serverebene —
        # deshalb hier erneut einbinden. Siehe snippets/sicherheit.conf.
        include /etc/nginx/snippets/sicherheit.conf;
    }
}
