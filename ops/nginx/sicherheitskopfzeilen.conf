# ===========================================================================
# SICHERHEITS-KOPFZEILEN FÜR DIE AUSGELIEFERTEN SEITEN
# ===========================================================================
#
# Die API setzt ihre Sicherheits-Kopfzeilen selbst (helmet). Die Web-Oberfläche
# (HTML, Skripte, Stile) liefert dagegen nginx aus; diese Datei gibt ihr
# denselben Schutz mit: gegen Einbetten in fremde Seiten (Clickjacking) und
# gegen eingeschleuste Skripte. Eingebunden wird sie in apps/web/nginx.conf.
#
# `always` sorgt dafür, dass die Kopfzeilen auch bei Fehlerantworten (4xx/5xx)
# gesendet werden.
#
# nginx vererbt `add_header` NICHT in einen `location`-Block, der selbst ein
# `add_header` setzt. Deshalb steht das hier als eigene Datei und wird in jedem
# solchen Block erneut per `include` eingebunden.
#
# ZUR RICHTLINIE
#
# `script-src 'self'` ohne `unsafe-inline`: Die gebaute Oberfläche enthält kein
# Inline-Skript. `style-src` braucht `'unsafe-inline'`, weil React
# Stil-Attribute an Elementen setzt. `img-src` erlaubt zusätzlich `data:` und
# `blob:` für Icons und die Vorschau beim Hochladen von Profilbildern.
# Wer eigene externe Quellen einbindet (z. B. Schriften oder Analyse-Dienste
# von fremden Servern), muss die Richtlinie entsprechend erweitern.
#
# `frame-ancestors 'none'` ist die moderne Fassung von X-Frame-Options;
# letzteres steht für ältere Browser daneben.
#
# HSTS bewusst OHNE `includeSubDomains` und OHNE `preload`: Die Zusage gilt nur
# für den Host, unter dem SozioLog läuft. So bleiben andere Subdomains derselben
# Domain, die (noch) kein HTTPS sprechen, erreichbar, und die Einstellung lässt
# sich jederzeit zurücknehmen. Wer beides will, ergänzt es bewusst selbst.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
