# ===========================================================================
# SICHERHEITS-KOPFZEILEN FÜR ALLE AUSGELIEFERTEN SEITEN ([A.12])
# ===========================================================================
#
# WARUM DIESE DATEI GETEILT WIRD: `helmet()` läuft nur im Node-Prozess und
# schützt damit ausschliesslich `/api`-Antworten. Das HTML selbst — die
# Anmeldeseite der Kundeninstanz, die der Verwaltung, die Marketing-Seite —
# liefert nginx aus, und das tat es ohne eine einzige dieser Zeilen. Die
# Oberflächen mit den Sitzungs-Cookies waren damit einbettbar (Clickjacking auf
# Beschluss- und Verwaltungsaktionen) und hatten kein Netz gegen eingeschleuste
# Skripte.
#
# ===========================================================================
# `always` IST PFLICHT, UND `include` AUCH
# ===========================================================================
#
# Ohne `always` fehlen die Kopfzeilen bei 4xx und 5xx — also genau dort, wo eine
# Fehlerseite fremde Inhalte zeigen könnte.
#
# UND: nginx vererbt `add_header` NICHT in einen `location`-Block, der selbst
# ein `add_header` setzt. Ein Block wie
#     location = /index.html { add_header Cache-Control "no-cache"; }
# verwirft damit STILL sämtliche Kopfzeilen der Serverebene. Deshalb steht das
# hier als Datei und wird in jedem solchen Block noch einmal eingebunden.
#
# ===========================================================================
# ZUR RICHTLINIE
# ===========================================================================
#
# `script-src 'self'` ohne `unsafe-inline` ist tragbar, weil die gebauten
# Seiten KEIN Inline-Skript enthalten — geprüft in allen drei dist-Ausgaben,
# jedes `<script>` hat ein `src`.
#
# `style-src` braucht `'unsafe-inline'`: Die Marketing-Seite hat einen
# `<style>`-Block, und React setzt Stil-Attribute an Elementen, die ohne diese
# Erlaubnis ebenfalls verworfen würden.
#
# `img-src` erlaubt zusätzlich `data:` und `blob:` — Vorschaubilder beim
# Avatar-Upload entstehen als Blob im Browser, Icons teils als data-URI.
#
# `frame-ancestors 'none'` ist die moderne Fassung von X-Frame-Options; letzteres
# steht für ältere Browser daneben.
#
# HSTS OHNE `preload` und OHNE `includeSubDomains` ([Review B4]): `preload`
# ist praktisch nicht zurückzunehmen. Und `includeSubDomains` wäre falsch —
# mail.soziolog.com und autoconfig.soziolog.com sprechen nur HTTP; ein Browser,
# der soziolog.com einmal gesehen hätte, käme dort nicht mehr hin. Die Zusage
# gilt deshalb nur für den jeweiligen Host.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
